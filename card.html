<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Визитка — Андрей Чупров</title>
    <!-- Библиотека для генерации QR -->
    <script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
    <style>
        :root {
            --bg: #0d1117;
            --card: #161b22;
            --text: #e6edf3;
            --muted: #8b949e;
            --accent: #58a6ff;
            --green: #3fb950;
            --border: #30363d;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: radial-gradient(circle at top right, rgba(88, 166, 255, 0.15), transparent),
                        radial-gradient(circle at bottom left, rgba(63, 185, 80, 0.1), transparent);
            background-color: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .card {
            background: rgba(22, 27, 34, 0.8);
            backdrop-filter: blur(12px);
            border: 1px solid var(--border);
            border-radius: 24px;
            padding: 35px 30px;
            text-align: center;
            max-width: 420px;
            width: 100%;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
        }
        .name {
            font-size: 1.8rem;
            font-weight: 700;
            margin-bottom: 5px;
            background: linear-gradient(90deg, #58a6ff, #3fb950);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }
        .title {
            font-size: 1rem;
            color: var(--muted);
            margin-bottom: 25px;
        }
        .qr-container {
            background: #fff;
            padding: 15px;
            border-radius: 16px;
            display: inline-block;
            margin-bottom: 20px;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.2);
        }
        .instruction {
            font-size: 0.9rem;
            color: var(--muted);
            line-height: 1.4;
            margin-bottom: 25px;
        }
        .instruction strong {
            color: var(--text);
        }
        
        /* Стили для кнопок связи */
        .contacts {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-bottom: 25px;
        }
        .contact-btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            padding: 12px;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid var(--border);
            border-radius: 12px;
            color: var(--text);
            text-decoration: none;
            font-size: 0.95rem;
            font-weight: 500;
            transition: all 0.2s ease;
        }
        .contact-btn:hover {
            background: rgba(88, 166, 255, 0.1);
            border-color: var(--accent);
            transform: translateY(-2px);
        }
        .contact-btn .icon {
            font-size: 1.2rem;
        }
        
        .badges {
            display: flex;
            justify-content: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .badge {
            font-size: 0.75rem;
            padding: 4px 12px;
            border: 1px solid var(--accent);
            color: var(--accent);
            border-radius: 20px;
        }
        .badge.green { border-color: var(--green); color: var(--green); }
    </style>
</head>
<body>

    <div class="card">
        <div class="name">Андрей Чупров</div>
        <div class="title">ИП · Автор «Инженерного переводчика»</div>
        
        <!-- QR-код -->
        <div class="qr-container" id="qrcode"></div>
        
        <div class="instruction">
            <strong>Наведите камеру телефона</strong><br>
            чтобы открыть техническое демо и<br>заключение экспертов
        </div>
        
        <!-- Кнопки связи -->
        <div class="contacts">
            <!-- Номер телефона -->
            <a href="tel:+79129664222" class="contact-btn">
                <span class="icon">📱</span> +7 (912) 966-42-22
            </a>

            <!-- Telegram -->
            <a href="https://t.me/FredCom1" target="_blank" class="contact-btn">
                <span class="icon">✈️</span> Telegram: @FredCom1
            </a>

            <!-- MAX -->
            <a href="https://max.ru/u/f9LhodD0c0KCKWTssBE3qkizuthK2rGzkTvtleSvmkUUTP04mfI6fOl50f0" target="_blank" class="contact-btn">
                <span class="icon">💬</span> Написать в MAX
            </a>

            <!-- НОВАЯ КНОПКА: ПОРТФОЛИО -->
            <a href="https://andrey777-ai.github.io/portfolio/" target="_blank" class="contact-btn" style="border-color: #3fb950; color: #3fb950;">
                <span class="icon">🌐</span> Смотреть портфолио (34 проекта)
            </a>
        </div>
        
        <div class="badges">
            <span class="badge">Сертификат АСИ</span>
            <span class="badge green">On-Premise</span>
        </div>
    </div>

    <script>
        // Ссылка на опубликованную визитку
        const projectUrl = "https://andrey777-ai.github.io/portfolio/card.html";
        
        new QRCode(document.getElementById("qrcode"), {
            text: projectUrl,
            width: 180,
            height: 180
        });
    </script>
</body>
</html>
